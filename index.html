<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Profile card component - minimalist dark design" />

    <title>Profile Card</title>

    <!-- ===== Geist Sans (Vercel) via jsDelivr ===== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css" />

    <!-- ===== Remix Icons ===== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" />

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <article class="profile-card" aria-label="User profile card">
      <!-- ===== Avatar ===== -->
      <div class="avatar-wrap">
        <img class="avatar" src="assets/images/profile.png" alt="Profile photo" width="96" height="96" loading="eager" />
      </div>

      <!-- ===== Name and bio ===== -->
      <div class="card-text">
        <h1 class="profile-name">Thomas Brooks</h1>
        <p class="profile-bio">
          Software Developer.<br>"Building things that matter, one commit at a time".
        </p>
      </div>

      <!-- ===== Divider ===== -->
      <div class="divider" aria-hidden="true"></div>

      <!-- ===== Social links ===== -->
      <div class="social-row" aria-label="Social links">
        <a href="#" class="social-icon-btn" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
          <i class="ri-linkedin-box-fill"></i>
        </a>

        <a href="#" class="social-icon-btn" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile">
          <i class="ri-github-fill"></i>
        </a>

        <a href="#" class="social-icon-btn" target="_blank" rel="noopener noreferrer" aria-label="Personal portfolio">
          <i class="ri-link"></i>
        </a>
      </div>

      <!-- ===== CTA buttons ===== -->
      <div class="cta-row">
        <button type="button" class="btn-cta btn-add-friend" aria-label="Add friend">
          Add Friend
          <i class="ri-user-add-line"></i>
        </button>
        <button type="button" class="btn-cta btn-contact" aria-label="Contact">
          Contact
          <i class="ri-external-link-line"></i>
        </button>
      </div>
    </article>
  </body>
</html>
